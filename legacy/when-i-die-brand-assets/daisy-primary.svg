<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" fill="none">

<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="1.2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.08"/>
  </filter>
  <radialGradient id="paperGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#FFF7E7"/>
    <stop offset="100%" stop-color="#F4E8D4"/>
  </radialGradient>
  <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#71C75A"/>
    <stop offset="100%" stop-color="#3E9F48"/>
  </linearGradient>
  <linearGradient id="blueDrop" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#8FE1FF"/>
    <stop offset="100%" stop-color="#58B9E7"/>
  </linearGradient>
  <linearGradient id="petalYellow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFD95B"/>
    <stop offset="100%" stop-color="#F2BF2E"/>
  </linearGradient>
  <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFF8EA"/>
    <stop offset="100%" stop-color="#F8EBD8"/>
  </linearGradient>
  <style>
    .ink{stroke:#1F2328;stroke-linecap:round;stroke-linejoin:round}
    .rough{stroke:#1F2328;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.8}
    .thin{stroke:#1F2328;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.2}
    .label{font-family:Inter,Arial,sans-serif}
  </style>
</defs>

<g filter="url(#shadow)">
  <!-- petals -->
  <ellipse cx="108" cy="54" rx="20" ry="44" fill="#FFFDF8" class="rough"/>
  <ellipse cx="152" cy="70" rx="20" ry="44" transform="rotate(38 152 70)" fill="url(#petalYellow)" class="rough"/>
  <ellipse cx="170" cy="118" rx="20" ry="44" transform="rotate(83 170 118)" fill="#FFFDF8" class="rough"/>
  <ellipse cx="146" cy="162" rx="20" ry="44" transform="rotate(126 146 162)" fill="#FFFDF8" class="rough"/>
  <ellipse cx="97" cy="178" rx="20" ry="44" transform="rotate(176 97 178)" fill="#FFFDF8" class="rough"/>
  <ellipse cx="54" cy="162" rx="20" ry="44" transform="rotate(-128 54 162)" fill="#FFFDF8" class="rough"/>
  <ellipse cx="30" cy="118" rx="20" ry="44" transform="rotate(-84 30 118)" fill="#FFFDF8" class="rough"/>
  <ellipse cx="48" cy="71" rx="20" ry="44" transform="rotate(-39 48 71)" fill="#FFFDF8" class="rough"/>
  <!-- center heart -->
  <path d="M100 82c7-12 24-13 32-1 8-12 25-11 32 1 6 11 2 25-8 34l-24 23-24-23c-10-9-14-23-8-34z" fill="url(#petalYellow)" class="rough"/>
  <!-- stem -->
  <path d="M111 136c5 28 7 54 3 78-5 30-16 49-18 74" class="rough" stroke="url(#leafGreen)" stroke-width="11"/>
  <path d="M111 136c5 28 7 54 3 78-5 30-16 49-18 74" class="rough" stroke-width="3"/>
  <!-- leaves -->
  <path d="M106 189c17-6 29-1 39 14-18 8-30 7-39-14z" fill="url(#leafGreen)" class="rough"/>
  <path d="M104 204c-19-4-29 3-35 18 18 5 30 1 35-18z" fill="url(#leafGreen)" class="rough"/>
  <!-- drops -->
  <path d="M161 186c12 10 20 20 19 34-1 12-10 19-21 18-13-1-19-11-18-22 2-12 9-20 20-30z" fill="url(#blueDrop)" class="rough"/>
  <path d="M151 227c10 9 16 18 15 29-1 10-9 16-18 15-11-1-15-9-14-18 1-10 7-17 17-26z" fill="url(#blueDrop)" class="rough"/>
</g>
</svg>