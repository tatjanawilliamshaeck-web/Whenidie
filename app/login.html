<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in – When I Die™</title>
    <meta name="description" content="Log in to your When I Die™ account." />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="page-app page-login">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a href="../index.html" class="logo">
          <img src="../assets/Logo.svg" alt="When I Die™" class="logo-image" width="120" height="48" />
        </a>
        <nav class="nav">
          <a href="signup.html">Join the free beta</a>
          <a href="../index.html">Home</a>
        </nav>
      </div>
      <div class="announcement-bar">No doom. No guilt. Snacks encouraged.</div>
    </header>

    <main class="app-main" id="main-content">
      <div class="container container--narrow">
        <div class="auth-card">
          <h1 class="auth-title">Log in</h1>
          <p class="auth-subtitle">Welcome back. Your plan is right where you left it.</p>

          <div id="auth-error" class="auth-error" role="alert" hidden>
            <span id="auth-error-text"></span>
            <button type="button" class="auth-error-close" aria-label="Dismiss">×</button>
          </div>

          <form id="login-form" class="auth-form">
            <label class="auth-label" for="login-email">Email</label>
            <input type="email" id="login-email" name="email" class="auth-input" required autocomplete="email" placeholder="you@example.com" />

            <label class="auth-label" for="login-password">Password</label>
            <input type="password" id="login-password" name="password" class="auth-input" required autocomplete="current-password" placeholder="Your password" />

            <p class="auth-forgot"><a href="forgot-password.html">Forgot password?</a></p>

            <button type="submit" class="btn primary-btn auth-btn" id="login-submit" data-default-text="Log in">Log in</button>
          </form>

          <p class="auth-footer">Don’t have an account? <a href="signup.html">Join the free beta</a></p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var message = params.get('message');
        if (message === 'session-ended' && document.getElementById('auth-error-text')) {
          document.getElementById('auth-error-text').textContent = 'Your session ended. Please log in again.';
          document.getElementById('auth-error').hidden = false;
        }
        if (window.widSupabase) {
          window.widSupabase.auth.getSession().then(function (res) {
            if (res.data && res.data.session) window.location.href = 'dashboard.html';
          });
        }
        var form = document.getElementById('login-form');
        var errorEl = document.getElementById('auth-error');
        var submitBtn = document.getElementById('login-submit');

        function showError(msg) {
          document.getElementById('auth-error-text').textContent = msg;
          errorEl.hidden = false;
        }
        function hideError() {
          errorEl.hidden = true;
        }
        document.querySelector('.auth-error-close') && document.querySelector('.auth-error-close').addEventListener('click', hideError);

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          hideError();
          var defaultText = submitBtn.getAttribute('data-default-text') || submitBtn.textContent;
          submitBtn.disabled = true;
          submitBtn.textContent = 'Loading…';

          var supabase = window.widSupabase;
          if (!supabase) {
            showError('App not configured. Add your Supabase URL and anon key in app/config.js.');
            submitBtn.disabled = false;
            submitBtn.textContent = defaultText;
            return;
          }

          var email = document.getElementById('login-email').value.trim();
          var password = document.getElementById('login-password').value;

          supabase.auth.signInWithPassword({ email: email, password: password })
            .then(function (res) {
              if (res.error) {
                var msg = res.error.message || 'Invalid email or password.';
                if (msg.indexOf('Invalid login') !== -1 || msg.indexOf('invalid') !== -1) msg = 'Email or password didn’t match. Try again or use “Forgot password?”';
                showError(msg);
                submitBtn.disabled = false;
                submitBtn.textContent = defaultText;
                return;
              }
              window.location.href = 'dashboard.html';
            })
            .catch(function (err) {
              var msg = err && err.message ? err.message : 'Something went wrong. Try again in a moment.';
              if (msg.indexOf('Invalid login') !== -1 || msg.indexOf('invalid') !== -1) msg = 'Email or password didn’t match. Try again or use “Forgot password?”';
              showError(msg);
              submitBtn.disabled = false;
              submitBtn.textContent = defaultText;
            });
        });
      })();
    </script>
  </body>
</html>
