<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password – When I Die™</title>
    <meta name="description" content="Reset your When I Die™ password." />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="page-app page-forgot">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a href="../index.html" class="logo">
          <img src="../assets/Logo.svg" alt="When I Die™" class="logo-image" width="120" height="48" />
        </a>
        <nav class="nav">
          <a href="login.html">Log in</a>
          <a href="../index.html">Home</a>
        </nav>
      </div>
      <div class="announcement-bar">No doom. No guilt. Snacks encouraged.</div>
    </header>

    <main class="app-main" id="main-content">
      <div class="container container--narrow">
        <div class="auth-card">
          <h1 class="auth-title">Reset password</h1>
          <p class="auth-subtitle">Enter your email and we'll send you a link to set a new password.</p>

          <div id="auth-error" class="auth-error" role="alert" hidden>
            <span id="auth-error-text"></span>
            <button type="button" class="auth-error-close" aria-label="Dismiss">×</button>
          </div>
          <div id="auth-success" class="auth-success" role="status" hidden>
            <p>Check your email for a reset link. If you don't see it, check spam.</p>
          </div>

          <form id="forgot-form" class="auth-form">
            <label class="auth-label" for="forgot-email">Email</label>
            <input type="email" id="forgot-email" name="email" class="auth-input" required autocomplete="email" placeholder="you@example.com" />

            <button type="submit" class="btn primary-btn auth-btn" id="forgot-submit">Send reset link</button>
          </form>

          <p class="auth-footer"><a href="login.html">Back to log in</a></p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (function () {
        var form = document.getElementById('forgot-form');
        var errorEl = document.getElementById('auth-error');
        var successEl = document.getElementById('auth-success');
        var submitBtn = document.getElementById('forgot-submit');

        function showError(msg) {
          document.getElementById('auth-error-text').textContent = msg;
          errorEl.hidden = false;
          successEl.hidden = true;
        }
        function hideError() {
          errorEl.hidden = true;
        }
        function showSuccess() {
          errorEl.hidden = true;
          successEl.hidden = false;
        }
        document.querySelector('.auth-error-close') && document.querySelector('.auth-error-close').addEventListener('click', hideError);

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          hideError();
          var supabase = window.widSupabase;
          if (!supabase) {
            showError('App not configured.');
            return;
          }
          var email = document.getElementById('forgot-email').value.trim().toLowerCase();
          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending…';
          supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/app/login.html' })
            .then(function (res) {
              if (res.error) {
                showError(res.error.message || 'Something went wrong.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send reset link';
                return;
              }
              showSuccess();
              submitBtn.disabled = false;
              submitBtn.textContent = 'Send reset link';
            })
            .catch(function (err) {
              showError(err.message || 'Something went wrong.');
              submitBtn.disabled = false;
              submitBtn.textContent = 'Send reset link';
            });
        });
      })();
    </script>
  </body>
</html>
